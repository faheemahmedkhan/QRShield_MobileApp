name: 🔨 Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Allow triggering manually from the Actions tab
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Upload APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java (required by the Android SDK / Gradle) ─────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      # ── 3. Flutter ─────────────────────────────────────────────────────────
      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true          # Caches the Flutter SDK between runs

      # ── 4. Dependencies ────────────────────────────────────────────────────
      - name: Install pub dependencies
        run: flutter pub get

      # ── 5. Code quality (optional — remove if it blocks CI) ────────────────
      - name: Analyze code
        run: flutter analyze --no-fatal-infos
        continue-on-error: true   # Warnings won't fail the build

      # ── 6. Decode keystore (only when signing secrets are present) ─────────
      #
      #  To enable signed releases, add these 4 secrets in
      #  GitHub → Settings → Secrets and variables → Actions:
      #
      #    KEYSTORE_BASE64   – base64-encoded .jks file
      #                        (run: base64 -w 0 your.keystore)
      #    KEY_ALIAS         – key alias inside the keystore
      #    KEY_PASSWORD      – key password
      #    STORE_PASSWORD    – store password
      #
      - name: Decode keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode \
            > android/app/qrshield.keystore

      # ── 7. Build ───────────────────────────────────────────────────────────
      - name: Build release APK (signed)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          flutter build apk --release \
            --dart-define=FLUTTER_APP_FLAVOR=production
        env:
          KEYSTORE_FILE: qrshield.keystore
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

      - name: Build release APK (unsigned — no keystore secrets set)
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        run: flutter build apk --release

      # ── 8. Rename APK with branch + short SHA ──────────────────────────────
      - name: Rename APK
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BRANCH=$(echo "${{ github.ref_name }}" | tr '/' '-')
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/qrshield-${BRANCH}-${SHORT_SHA}.apk

      # ── 9. Upload artifact ─────────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QRShield-APK-${{ github.ref_name }}-${{ github.sha }}
          path: build/app/outputs/flutter-apk/qrshield-*.apk
          retention-days: 30      # Artifact kept for 30 days

      # ── 10. Print download hint ────────────────────────────────────────────
      - name: Build summary
        run: |
          echo "### ✅ APK Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the APK from the **Artifacts** section of this run." \
            >> $GITHUB_STEP_SUMMARY
